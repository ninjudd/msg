[package]
name = "msg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read and send iMessages from the command line"
publish = false

[lib]
name = "msg"
path = "src/lib.rs"

# Both binaries are auto-discovered from src/bin/ as they land: `msg`, which is
# what a person runs, and `msgd`, the launchd agent.

# Five of these represent a real choice; the rest are plumbing.
#
#   rusqlite       reading chat.db, which §3 said would get chosen not avoided
#   clap           the CLI, in place of commander
#   serde          keeps the wire format identical to the TypeScript one
#   chrono         local-timezone arithmetic, which nobody should hand-write
#   unicode-width  the UAX #11 tables, which decide how many terminal cells a
#                  name occupies. Not a dozen lines of parsing like the other
#                  patterns here: a Unicode table that goes stale every release.
#
# base64, libc and serde_json are plumbing for the above.
#
# Deliberately absent: `regex`, because the five patterns this program matches
# are each a dozen lines of hand-written parsing, and `tokio`, because the
# daemon is a thread per connection and a 2-second tick.
[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
